name: Feature request
description: Something the phoenix should learn
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Remember the house rules - no heavy dependencies, fail-closed defaults.
    validations:
      required: true
