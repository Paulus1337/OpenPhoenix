name: Bug report
description: Something burned that should not have
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: phoenix --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: linux x86_64 / macos arm64 / windows / docker
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config (redacted)
      render: toml
