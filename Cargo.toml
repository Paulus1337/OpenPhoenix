[package]
name = "openphoenix"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Personal AI agent runtime. Single static binary, small dependency tree."
repository = "https://github.com/Paulus1337/OpenPhoenix"
homepage = "https://github.com/Paulus1337/OpenPhoenix"
documentation = "https://github.com/Paulus1337/OpenPhoenix/wiki"

[[bin]]
name = "phoenix"
path = "src/main.rs"

[[bin]]
name = "phoenix-e2e"
path = "src/bin/e2e/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
serde_json = "1"
toml = "0.8"
ring = "0.17"
ctrlc = { version = "3.5", features = ["termination"] }

[profile.dev.package.ring]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
overflow-checks = true

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
